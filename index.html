<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Computer Science Program - Start Here</title>
  <meta name="description" content="Student onboarding portal for Computer Science program courses." />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ─── Header ──────────────────────────────────────────────────────────── -->
  <header class="site-header" role="banner">
    <div class="header-inner">
      <div class="logo-area">
        <div class="logo-placeholder" aria-hidden="true">CS</div>
        <a href="index.html" class="site-title" aria-label="Computer Science program home">
          Computer Science Program
          <small>Student Launch Portal</small>
        </a>
      </div>
      <nav class="header-nav" aria-label="Site navigation">
        <a href="instructor-prep.html" class="nav-link">Instructor Prep</a>
        <a href="help.html" class="nav-link nav-link--help" aria-label="Need help? Get support">Need Help?</a>
      </nav>
    </div>
  </header>

  <!-- ─── Main ─────────────────────────────────────────────────────────────── -->
  <main class="main-content" id="main-content">

    <!-- Course Selection -->
    <div id="course-selection" role="region" aria-label="Course selection">
      <section class="hero">
        <h1 class="hero-title">Computer Science Program</h1>
        <p class="hero-subtitle">START HERE</p>
        <p class="hero-desc">Welcome. Use this page to get ready for your first week.</p>
        <p class="course-select-prompt">Select your course to begin:</p>
      </section>
      <div class="course-grid" id="course-grid" role="list" aria-label="Available courses"></div>
    </div>

    <!-- Dashboard — shown after course selection -->
    <div id="dashboard" hidden role="region" aria-label="Onboarding dashboard"></div>

  </main>

  <!-- ─── Footer ───────────────────────────────────────────────────────────── -->
  <footer class="site-footer" role="contentinfo">
    <p>Computer Science Program</p>
    <p>Having trouble? <a href="help.html">Get help here.</a></p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/private-config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
